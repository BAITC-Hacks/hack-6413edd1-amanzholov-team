[project]
name = "career-quest"
version = "0.1.0"
description = "Career Quest modular backend"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.135.1",
  "uvicorn==0.41.0",
  "pydantic==2.12.5",
  "pydantic-settings==2.13.1",
  "sqlalchemy[asyncio]==2.0.48",
  "asyncpg==0.31.0",
  "alembic==1.18.4",
  "httpx==0.28.1",
  "argon2-cffi==25.1.0",
  "python-multipart==0.0.22",
]

[dependency-groups]
dev = ["ruff==0.15.6", "mypy==1.19.1", "pytest==9.0.2", "pytest-asyncio==1.3.0"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 79
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true
python_version = "3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["postgres: requires isolated PostgreSQL"]

