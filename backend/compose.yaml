name: career-quest-backend

x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://career_quest:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/career_quest

services:
  mobile:
    build: ../frontend/mobile
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build: ../frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy

  db:
    image: postgres:18.1
    environment:
      POSTGRES_DB: career_quest
      POSTGRES_USER: career_quest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_quest -d career_quest"]
      interval: 3s
      timeout: 3s
      retries: 20

  bootstrap:
    <<: *app
    volumes:
      - ../frontend/public/data:/data/canonical:ro
    command: ["uv", "run", "--no-sync", "python", "-m", "career_quest.startup"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5

  db-test:
    image: postgres:18.1
    profiles: ["test"]
    environment:
      POSTGRES_DB: career_quest_test
      POSTGRES_USER: career_quest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_quest -d career_quest_test"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
